name: Validate & Deploy jp-pixel-story to GitHub Pages

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: web/package-lock.json

      - name: Setup Python & uv (for Automated Content QA)
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.11"

      - name: Run Python MCP tests & validate all lessons in catalog
        working-directory: mcp-server
        run: |
          uv sync --extra dev
          PYTHONPATH=. uv run pytest -v

      - name: Setup GitHub Pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v5

      - name: Install web dependencies
        working-directory: web
        run: npm ci

      - name: Run frontend unit tests (ruby, dictation & stage engine)
        working-directory: web
        run: npm test

      - name: Build static site
        working-directory: web
        run: npm run build

      - name: Run exporter unit tests (timeline / audio plan)
        working-directory: exporter
        run: npm test

      - name: Install exporter Playwright + FFmpeg
        working-directory: exporter
        run: |
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg

      - name: Stage E2E - every animated story plays to the end + A/V sync of the exported MP4
        working-directory: exporter
        run: |
          (cd ../web && npx vite preview --host 127.0.0.1 --port 4173 --strictPort > /tmp/preview.log 2>&1 &)
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:4173/ > /dev/null && break; sleep 1; done
          npm run check:all -- --url http://127.0.0.1:4173
          npm run test:e2e -- --url http://127.0.0.1:4173 --story konbini-onigiri --fps 5

      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

  deploy:
    if: github.event_name != 'pull_request'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
